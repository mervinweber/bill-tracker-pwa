<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Progressive Web App for tracking bills due each pay period">
    <title>Bill Tracker PWA</title>
    <link rel="stylesheet" href="/src/index.css">
    <link rel="manifest" href="/manifest.json">
</head>

<body class="min-h-screen bg-background font-sans antialiased">
    <div id="app" class="relative flex min-h-screen flex-col">
        <header id="header"
            class="sticky top-0 z-40 w-full border-b bg-background shadow-sm">
        </header>
        <div class="flex-1 grid grid-cols-1 gap-4 px-4 sm:px-6 md:grid-cols-[220px_minmax(0,1fr)] lg:grid-cols-[240px_minmax(0,1fr)]">
            <aside id="sidebar"
                class="hidden md:flex shrink-0 self-start sticky top-[var(--header-height,4.5rem)] max-h-[calc(100vh-var(--header-height,4.5rem)-1rem)] overflow-y-auto border-r bg-muted/30">
            </aside>
            <main id="mainContent" class="w-full relative py-4 lg:py-6 lg:gap-10 pr-0 min-w-0">
                <div id="dashboard" class="px-0 pt-0 w-full"></div>
                <div id="billGrid" class="w-full"></div>
                <div id="calendarView" class="w-full"></div>
                <div id="analyticsView" class="w-full"></div>
                <div id="upcomingBillsView" class="w-full"></div>
            </main>
        </div>
        <div id="billForm"></div>
        <div id="paymentModals"></div>
    </div>
    <script type="module" src="/src/index.js"></script>
</body>

</html>
