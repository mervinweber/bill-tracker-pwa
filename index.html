<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A Progressive Web App for tracking bills due each pay period">
    <title>Bill Tracker PWA</title>
    <link rel="stylesheet" href="/src/index.css">
    <link rel="manifest" href="/manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="min-h-screen bg-background font-sans antialiased">
    <div id="app" class="relative flex min-h-screen flex-col">
        <header id="header"
            class="sticky top-0 z-40 w-full border-b bg-background/95 backdrop-blur supports-[backdrop-filter]:bg-background/60">
        </header>
        <div id="dashboard"></div>
        <div class="container mx-auto flex-1 flex flex-col md:flex-row items-start gap-4 px-4 md:px-8">
            <aside id="sidebar"
                class="w-full md:w-64 flex-col border-r bg-muted/30 hidden md:flex shrink-0 min-h-[calc(100vh-14rem)]">
            </aside>
            <main id="mainContent" class="flex-1 w-full relative py-6 lg:py-8 lg:gap-10">
                <div id="billGrid" class="w-full"></div>
                <div id="calendarView" class="w-full"></div>
                <div id="analyticsView" class="w-full"></div>
                <div id="upcomingBillsView" class="w-full"></div>
            </main>
        </div>
        <div id="billForm"></div>
        <div id="paymentModals"></div>
    </div>
    <script type="module" src="/src/payment-history.js"></script>
    <script type="module" src="/src/index.js"></script>
</body>

</html>
